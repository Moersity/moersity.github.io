name: Publish inference systems daily report

on:
  schedule:
    # GitHub cron uses UTC. Start at 08:30 Asia/Shanghai, then wait 0-15 minutes.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      skip_delay:
        description: Skip the randomized delay
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: inference-systems-daily-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for today's deterministic random slot
        if: github.event_name == 'schedule' || !inputs.skip_delay
        run: |
          day="$(date +%F)"
          hex="$(printf '推理系统技术日报|%s' "$day" | sha256sum | cut -c1-8)"
          delay=$((16#$hex % 901))
          echo "Publishing after ${delay}s (08:30-08:45 Asia/Shanghai)."
          sleep "$delay"

      - name: Generate report and static pages
        run: python3 scripts/generate_daily_report.py

      - name: Commit the new report
        run: |
          day="$(date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/
          if git diff --cached --quiet; then
            echo "No new report to publish."
            exit 0
          fi
          git commit -m "content(daily): publish ${day} inference report"
          git push
